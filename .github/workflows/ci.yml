name: ci
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
  
  image:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t digital-twin .
  # Production deploy: Dokploy pulls main and rebuilds docker-compose.prod.yml
  # when its deploy webhook is called. Runs only after every check above
  # passed on a push to main, so a red build never reaches the server.
  # DOKPLOY_WEBHOOK_URL is a repository secret holding the Compose service's
  # webhook URL from Dokploy (service → Deployments → Webhook URL).
  deploy:
    runs-on: ubuntu-latest
    needs: [server, client, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL secret is not set; skipping deploy."
            exit 0
          fi
          # Dokploy accepts a GitHub push payload; `ref` lets it match the branch.
          curl --fail --silent --show-error -X POST "$WEBHOOK_URL" \
            -H "content-type: application/json" \
            -d "{\"ref\":\"${GITHUB_REF}\",\"after\":\"${GITHUB_SHA}\"}"
